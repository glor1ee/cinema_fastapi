<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Your account is active</title></head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #16202b;">
    <h2>Your account is active</h2>
    <p>Hello, <strong id="email">{{ email }}</strong>.</p>
    <p>Your account has been activated and you can now sign in.</p>
    <p><a id="link" href="{{ login_link }}">Go to login</a></p>
    <p style="color:#6b7885; font-size: 13px;">
      If you did not expect this email you can safely ignore it.
    </p>
  </body>
</html>
