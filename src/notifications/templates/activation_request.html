<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Activate your account</title></head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #16202b;">
    <h2>Activate your account</h2>
    <p>Hello, <strong id="email">{{ email }}</strong>.</p>
    <p>Thank you for registering. Use the link below to activate your account. The link is valid for 24 hours.</p>
    <p><a id="link" href="{{ activation_link }}">Activate account</a></p>
    <p style="color:#6b7885; font-size: 13px;">
      If you did not expect this email you can safely ignore it.
    </p>
  </body>
</html>
