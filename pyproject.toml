[tool.poetry]
name = "online-cinema"
version = "0.1.0"
description = "Online cinema platform: accounts, movie catalog, cart and orders"
authors = ["glor1ee <sashok1764@icloud.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
gunicorn = "^23.0.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.21.0"
psycopg2-binary = "^2.9.10"
pydantic = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.7.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "4.0.1"
python-multipart = "^0.0.20"
celery = "^5.4.0"
redis = "^5.2.0"
aiosmtplib = "^4.0.0"
jinja2 = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"
pytest-cov = "^6.0.0"
pytest-env = "^1.1.5"
httpx = "^0.28.1"
flake8 = "^7.1.1"
black = "^24.10.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "src/database/migrations"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["src/database/migrations", "src/tests"]

[tool.coverage.run]
source = ["src"]
concurrency = ["greenlet", "thread"]
omit = [
    "src/tests/*",
    "src/database/migrations/*",
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
